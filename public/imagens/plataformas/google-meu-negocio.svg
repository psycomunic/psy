<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Google Meu Negócio">
  <!--
    A vitrine do Google Meu Negócio: toldo listrado e o G na fachada.

    Desenhada, e não a logo com a palavra "Google" ao lado: a versão com
    texto que circula está em espanhol ("Mi Negocio"), e o texto some em
    26px de altura de qualquer forma. A vitrine é a parte que se
    reconhece no tamanho em que ela aparece na página.
  -->
  <defs>
    <clipPath id="gmn-toldo">
      <path d="M8.5 6h31L43 17.5H5z"/>
    </clipPath>
  </defs>

  <!-- Fachada -->
  <path fill="#4285F4" d="M9 17.5h30V39a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V17.5z"/>

  <!-- Toldo, em faixas -->
  <g clip-path="url(#gmn-toldo)">
    <rect x="5" y="6" width="6.34" height="11.5" fill="#5C85DE"/>
    <rect x="11.34" y="6" width="6.34" height="11.5" fill="#3F63C4"/>
    <rect x="17.68" y="6" width="6.34" height="11.5" fill="#5C85DE"/>
    <rect x="24.02" y="6" width="6.34" height="11.5" fill="#3F63C4"/>
    <rect x="30.36" y="6" width="6.34" height="11.5" fill="#5C85DE"/>
    <rect x="36.7" y="6" width="6.34" height="11.5" fill="#3F63C4"/>
  </g>

  <!-- O G, em branco, centrado na fachada -->
  <g transform="translate(17.6 23) scale(0.29)">
    <path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/>
  </g>
</svg>
